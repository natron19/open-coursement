# GRADE Goal: turn a topic, audience, and skill level into a Markdown course outline a
# subject-matter expert can build from. "Good" = a "# " title, 5-8 modules, each with one
# "By the end of this module..." objective and 3-5 specific lessons.
# Top concerns: depth and vocabulary match the stated audience and skill level, and the
# content is technically accurate (no invented tools, APIs, or practices).
template: coursement_outline_v1

rubric:
  - dimension: useful
    criterion: The outline is calibrated to the stated audience and skill level. Beginner outlines start from first principles without jargon; advanced outlines skip basics and focus on nuance and tradeoffs.
  - dimension: accurate
    criterion: The subject-matter content is accurate. Named tools, techniques, and concepts are real and correctly described, with nothing invented.
  - dimension: useful
    criterion: Learning objectives use measurable action verbs and the modules progress in a sensible order.

# Output is Markdown, not JSON, so module count and per-module objectives are checked
# with regexes over the "## Module N:" blocks instead of count_between / each_has_keys.
cases:
  - id: golden_beginner_pandas
    kind: golden
    segment: career_switcher
    variables:
      topic: "Python for Data Analysis with Pandas"
      target_audience: "Business analysts who know Excel but have never written code"
      skill_level: "beginner"
      extra_notes: "Emphasize real-world datasets; avoid computer science theory"
    checks:
      - { type: not_empty }
      - { type: matches, pattern: "\\A\\s*# \\S" }
      - { type: contains_all, values: ["Target Audience:", "Skill Level:", "Estimated Duration:", "Course Overview"] }
      - type: matches
        # 5 to 8 "## Module N:" blocks
        pattern: '\A(?:(?!^## Module )[\s\S])*(?:^## Module [^\n]*\n(?:(?!^## Module )[\s\S])*){5,8}\z'
      - type: matches
        # every module block contains a Learning Objective line
        pattern: '\A(?:(?!^## Module )[\s\S])*(?:^## Module [^\n]*\n(?:(?!^## Module |Learning Objective:)[\s\S])*Learning Objective:(?:(?!^## Module )[\s\S])*)+\z'
      - { type: contains_all, values: ["By the end of this module, learners will be able to"] }
      - { type: contains_all, values: ["{{skill_level}}"], dimension: accurate }
      - { type: not_contains, values: ["```"] }
      - { type: max_words, value: 1500, dimension: efficient }

